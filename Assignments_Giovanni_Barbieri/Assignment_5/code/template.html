<html>
    <head>
        <meta charset="UTF-8">
        <script src="gl-matrix-min.js"></script>
        <script src="geometry.js"></script>
        <script type="text/javascript">

            var vertexShaderCode =
                `#version 300 es
                in vec3 a_position;
                in vec3 a_normal;
                in vec3 a_color;

                uniform mat4 u_model;
                uniform mat4 u_view;
                uniform mat4 u_proj;
                uniform mat3 u_normalMatrix;

                out vec3 v_color;
                out vec3 v_normal;

                void main(){
                    v_color = a_color;
                    v_normal = normalize(u_normalMatrix * a_normal);
                    gl_Position = u_proj * u_view * u_model * vec4(a_position, 1.0);
                }`;

            var fragmentShaderCode =
                `#version 300 es
                precision mediump float;

                in vec3 v_color;
                in vec3 v_normal; // not used in Exercise 1, but kept for Exercise 2

                out vec4 out_color;
                void main(){
                    out_color = vec4(v_color, 1.0);
                }`;

            var gl; // WebGL context
            var shaderProgram; // the GLSL program we will use for rendering
            var plane_vao;
            var cube_vao;
            var sphere_vao;

            // uniform locations (cached)
            var uModelLoc, uViewLoc, uProjLoc, uNormalMatLoc;


            // The function initilize the WebGL canvas
            function initWebGL(){
                var canvas = document.getElementById("webgl-canvas");
                gl = canvas.getContext("webgl2");

                //keep the size of the canvas for leter rendering
                gl.viewportWidth = canvas.width;
                gl.viewportHeight = canvas.height;

                //check for errors
                if(gl){
                    console.log("WebGL succesfully initialized.");
                }else{
                    console.log("Failed to initialize WebGL.")
                }
            }

            // This function compiles a shader
            function compileShader(shader, source, type, name = ""){
                // link the source of the shader to the shader object
                gl.shaderSource(shader,source);
                // compile the shader
                gl.compileShader(shader);
                // check for success and errors
                let success = gl.getShaderParameter(shader, gl.COMPILE_STATUS);
                if(success){
                    console.log(name + " shader compiled succesfully.");
                }else{
                    console.log(name + " shader error.")
                    console.log(gl.getShaderInfoLog(shader));
                }
            }

            // This function links the GLSL program by combining different shaders
            function linkProgram(program,vertShader,fragShader){
                // attach vertex shader to the program
                gl.attachShader(program,vertShader);
                // attach fragment shader to the program
                gl.attachShader(program,fragShader);
                // link the program
                gl.linkProgram(program);
                // check for success and errors
                if (gl.getProgramParameter(program, gl.LINK_STATUS)) {
                    console.log("The shaders are initialized.");
                }else{
                    console.log("Could not initialize shaders.");
                }
            }

            function createGLSLPrograms(){
                var vertexShader = gl.createShader(gl.VERTEX_SHADER);
                compileShader(vertexShader, vertexShaderCode, gl.VERTEX_SHADER, "Vertex shader");
                // Creating fragment shader
                var fragmentShader = gl.createShader(gl.FRAGMENT_SHADER);
                compileShader(fragmentShader, fragmentShaderCode, gl.FRAGMENT_SHADER, "Fragment shader");
                // Creating and linking the program
                shaderProgram = gl.createProgram();
                linkProgram(shaderProgram, vertexShader, fragmentShader);
            }


            // TIP: Since one has to repeat creating VAO of each object (e.g., cube, plane, sphere) separately,
            // we suggest to implement a function which takes the arrays containing values of the attributes,
            // and then, creates VBOa, VAOs, and sets up the attributes.
            // This should later simplify your code in initBuffers() to something like:
            //      cube_vao = gl.createVertexArray();
            //      createVAO(cube_vao, shaderProgram, cube_vertices, cube_normals, cube_colors);
            //      sphere_vao = gl.createVertexArray();
            //      createVAO(sphere_vao, shaderProgram, sphere_vertices, sphere_vertices, sphere_colors);
            //      plane_vao = gl.createVertexArray();
            //      createVAO(plane_vao, shaderProgram, plane_vertices, plane_normals, plane_colors);
            function createVAO(vao, shader, vertices, normals, colors){
                gl.bindVertexArray(vao);

                // positions
                let positionBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
                let positionLoc = gl.getAttribLocation(shader, "a_position");
                gl.enableVertexAttribArray(positionLoc);
                gl.vertexAttribPointer(positionLoc, 3, gl.FLOAT, false, 0, 0);

                // normals
                let normalBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(normals), gl.STATIC_DRAW);
                let normalLoc = gl.getAttribLocation(shader, "a_normal");
                gl.enableVertexAttribArray(normalLoc);
                gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 0, 0);

                // colors
                let colorBuffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);
                let colorLoc = gl.getAttribLocation(shader, "a_color");
                gl.enableVertexAttribArray(colorLoc);
                gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, 0, 0);

                gl.bindVertexArray(null);
            }

            function initBuffers(){
                plane_vao = gl.createVertexArray();
                createVAO(plane_vao, shaderProgram, plane_vertices, plane_normals, plane_colors);

                cube_vao = gl.createVertexArray();
                createVAO(cube_vao, shaderProgram, cube_vertices, cube_normals, cube_colors);

                sphere_vao = gl.createVertexArray();
                createVAO(sphere_vao, shaderProgram, sphere_vertices, sphere_normals, sphere_colors);
            }

            function draw(){
                // input variables for controling camera and light parameters
                // feel free to use these or create your own
                let camera_azimuthal_angle = document.getElementById("camera_azimuthal_angle").value * Math.PI / 180;
                let camera_polar_angle = document.getElementById("camera_polar_angle").value * Math.PI / 180;
                let camera_distance = document.getElementById("camera_distance").value / 10;
                let camera_fov = document.getElementById("camera_fov").value * Math.PI / 180;
                let light_azimuthal_angle = document.getElementById("light_azimuthal_angle").value * Math.PI / 180;
                let light_polar_angle = document.getElementById("light_polar_angle").value * Math.PI / 180;

                // Camera position from spherical coordinates (r, theta, phi)
                // theta = azimuth around Y axis, phi = polar from +Y axis
                let sinPhi = Math.sin(camera_polar_angle);
                let camera_x = camera_distance * sinPhi * Math.cos(camera_azimuthal_angle);
                let camera_z = camera_distance * sinPhi * Math.sin(camera_azimuthal_angle);
                let camera_y = camera_distance * Math.cos(camera_polar_angle);
                let camera_position = vec3.fromValues(camera_x, camera_y, camera_z);

                // Light direction from spherical coordinates (kept for Exercise 2)
                let sinLPhi = Math.sin(light_polar_angle);
                let light_x = sinLPhi * Math.cos(light_azimuthal_angle);
                let light_z = sinLPhi * Math.sin(light_azimuthal_angle);
                let light_y = Math.cos(light_polar_angle);
                let lightDirection = vec3.fromValues(light_x, light_y, light_z);

                // Model rotation slider (used to verify model transforms)
                var rotation = document.getElementById("rotation");
                let modelRotation = (rotation.value - 100) / 100 * Math.PI;


                gl.viewport(0, 0, gl.viewportWidth, gl.viewportHeight);
                gl.clearColor(0.2, 0.2, 0.2, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
                //gl.enable(gl.CULL_FACE);
                gl.enable(gl.DEPTH_TEST);

                // enable the GLSL program for the rendering
                gl.useProgram(shaderProgram);

                // Compute view + projection once per frame
                let viewMatrix = mat4.create();
                mat4.lookAt(viewMatrix, camera_position, vec3.fromValues(0.0, 0.0, 0.0), vec3.fromValues(0.0, 1.0, 0.0));

                let projMatrix = mat4.create();
                let aspect = gl.viewportWidth / gl.viewportHeight;
                mat4.perspective(projMatrix, camera_fov, aspect, 0.1, 100.0);

                gl.uniformMatrix4fv(uViewLoc, false, viewMatrix);
                gl.uniformMatrix4fv(uProjLoc, false, projMatrix);

                // TIPS:
                // - Before drawing anything using the program you still have to set values of all uniforms.
                // - As long as you use the same shader program you do not need to set all uniforms everytime you draw new object. The programs remembers the uniforms after calling gl.drawArrays
                // - The same, if you draw the same object, e.g., cube, multiple times, you do not need to bind the corresponding VAO everytime you draw, but you may want to change the transformation matrices.

                // --- Draw ground plane ---
                {
                    let modelMatrix = mat4.create();
                    mat4.rotateY(modelMatrix, modelMatrix, modelRotation);
                    mat4.scale(modelMatrix, modelMatrix, vec3.fromValues(8.0, 1.0, 8.0));

                    let normalMat = mat3.create();
                    mat3.normalFromMat4(normalMat, modelMatrix);

                    gl.uniformMatrix4fv(uModelLoc, false, modelMatrix);
                    gl.uniformMatrix3fv(uNormalMatLoc, false, normalMat);
                    gl.bindVertexArray(plane_vao);
                    gl.drawArrays(gl.TRIANGLES, 0, plane_vertices.length / 3);
                }

                // --- Draw two cube instances ---
                {
                    gl.bindVertexArray(cube_vao);

                    // cube #1
                    let modelMatrix = mat4.create();
                    mat4.fromTranslation(modelMatrix, vec3.fromValues(-1.2, 0.5, 0.0));
                    mat4.rotateY(modelMatrix, modelMatrix, modelRotation);
                    let normalMat = mat3.create();
                    mat3.normalFromMat4(normalMat, modelMatrix);
                    gl.uniformMatrix4fv(uModelLoc, false, modelMatrix);
                    gl.uniformMatrix3fv(uNormalMatLoc, false, normalMat);
                    gl.drawArrays(gl.TRIANGLES, 0, cube_vertices.length / 3);

                    // cube #2
                    modelMatrix = mat4.create();
                    mat4.fromTranslation(modelMatrix, vec3.fromValues(1.1, 0.5, 0.6));
                    mat4.rotateY(modelMatrix, modelMatrix, -modelRotation * 0.7);
                    mat4.scale(modelMatrix, modelMatrix, vec3.fromValues(0.7, 1.3, 0.7));
                    normalMat = mat3.create();
                    mat3.normalFromMat4(normalMat, modelMatrix);
                    gl.uniformMatrix4fv(uModelLoc, false, modelMatrix);
                    gl.uniformMatrix3fv(uNormalMatLoc, false, normalMat);
                    gl.drawArrays(gl.TRIANGLES, 0, cube_vertices.length / 3);
                }

                // --- Draw sphere ---
                {
                    let modelMatrix = mat4.create();
                    mat4.fromTranslation(modelMatrix, vec3.fromValues(0.0, 0.5, -1.3));
                    mat4.scale(modelMatrix, modelMatrix, vec3.fromValues(1.0, 1.0, 1.0));

                    let normalMat = mat3.create();
                    mat3.normalFromMat4(normalMat, modelMatrix);

                    gl.uniformMatrix4fv(uModelLoc, false, modelMatrix);
                    gl.uniformMatrix3fv(uNormalMatLoc, false, normalMat);
                    gl.bindVertexArray(sphere_vao);
                    gl.drawArrays(gl.TRIANGLES, 0, sphere_vertices.length / 3);
                }


                // this line is required for creating an animation and updating the rendering
                window.requestAnimationFrame(function() {draw();});
            }
            function start(){
                // initialze WebGL
                initWebGL();
                // create GLSL programs
                createGLSLPrograms();

                // cache uniform locations
                gl.useProgram(shaderProgram);
                uModelLoc = gl.getUniformLocation(shaderProgram, "u_model");
                uViewLoc = gl.getUniformLocation(shaderProgram, "u_view");
                uProjLoc = gl.getUniformLocation(shaderProgram, "u_proj");
                uNormalMatLoc = gl.getUniformLocation(shaderProgram, "u_normalMatrix");

                // initialize all the buffers and set up the vertex array objects (VAO)
                initBuffers();
                // draw
                draw();
            }

        </script>
    </head>

    <body onload="start();">
        <canvas id="webgl-canvas" width="768" height="768"></canvas>
        <div  style="float: right">
            <div class="slidecontainer">
                Rotation:</br><input type="range" min="0" max="200" value="100" id="rotation">
            </div>
            <h4>Camera:</h4>
            <div class="slidecontainer">
                Azimuthal angle:</br><input type="range" min="-270" max="90" value="-45" id="camera_azimuthal_angle">
            </div>
            <div class="slidecontainer">
                Polar angle:</br><input type="range" min="1" max="179" value="60" id="camera_polar_angle">
            </div>
            <div class="slidecontainer">
                Distance:</br><input type="range" min="20" max="200" value="50" id="camera_distance">
            </div>
            <div class="slidecontainer">
                Field of view:</br><input type="range" min="10" max="150" value="45" id="camera_fov">
            </div>

            <h4>Light:</h4>
            <div class="slidecontainer">
                Azimuthal angle:</br><input type="range" min="-270" max="90" value="-70" id="light_azimuthal_angle">
            </div>
            <div class="slidecontainer">
                Polar angle:</br><input type="range" min="1" max="90" value="60" id="light_polar_angle">
            </div>
        </div>
    </body>

</html>
